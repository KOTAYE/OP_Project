<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта областей України</title>
    <!-- Підключення стилів Leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Карта областей України</h1>
    
    <div id="map"></div>

    <!-- Підключення скриптів Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Ініціалізація карти
            const map = L.map('map').setView([49.0, 31.0], 6);  // Центруємо на Україні

            // Додаємо шар карти OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Завантаження GeoJSON даних для областей
            fetch('/staticfiles/ukraine_oblasts.geojson')
                .then(response => response.json())
                .then(geojsonData => {
                    // Додаємо GeoJSON на карту
                    L.geoJSON(geojsonData).addTo(map);
                })
                .catch(error => console.error('Помилка завантаження GeoJSON:', error));
        });
    </script>
</body>
</html>
